<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>वसुली</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f4ef;--card:#fbfaf7;--ink:#26302b;--mute:#6b746e;--line:#e1dfd6;--main:#1f5a45;--onmain:#fff;--red:#b3402f;--yel:#9a6b00;--grn:#2c7a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b201d;--card:#232a26;--ink:#e6e9e4;--mute:#98a39b;--line:#333c37;--main:#5fb08a;--onmain:#102018;--red:#e0806f;--yel:#d9a93c;--grn:#6cc08c}}
:root[data-theme="dark"]{--bg:#1b201d;--card:#232a26;--ink:#e6e9e4;--mute:#98a39b;--line:#333c37;--main:#5fb08a;--onmain:#102018;--red:#e0806f;--yel:#d9a93c;--grn:#6cc08c}
html{font-size:17px;height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans Devanagari',system-ui,sans-serif;line-height:1.5}
#app{max-width:640px;margin:0 auto;padding:12px 14px 96px}
h1{font-size:1.25rem;margin:4px 0 10px}h2{font-size:1.05rem;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:.85rem}.big{font-size:1.3rem;font-weight:700}
.red{color:var(--red)}.yel{color:var(--yel)}.grn{color:var(--grn)}
button,input,select,textarea{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:4px 0}
button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
button.p{background:var(--main);color:var(--onmain);border-color:var(--main);font-weight:600}
button.sm{min-height:36px;padding:6px 10px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;border:0;border-radius:0;background:none;min-height:56px;color:var(--mute)}
.tabs button.on{color:var(--main);font-weight:700;box-shadow:inset 0 3px 0 var(--main)}
.fab{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:6;width:52px;height:52px;border-radius:26px;padding:0;font-size:1.4rem}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-width:640px;margin:0 auto;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:14px;box-sizing:border-box}
.tag{display:inline-block;padding:1px 8px;border-radius:8px;border:1px solid var(--line);font-size:.8rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t{border-left:3px solid var(--line);padding-left:10px;margin:8px 0}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
const TAGS=['वचन दिले','फोन उचलला नाही','फोन बंद','नकार दिला','भांडण','पैसे दिले'];
const MODES=['रोख','UPI','चेक'];const CAT={fert:'खत',seed:'बियाणे',pest:'औषध'};
let DB={cust:[],cfg:{rate:2,unit:'month',start:'2026-12-31',on:true},pend:null,lang:'mr'},tab='today',q='',sel=null,calcOpen=false;
try{const s=localStorage.getItem('vasuli_v1');if(s)DB=Object.assign(DB,JSON.parse(s))}catch(e){}
function save(){try{localStorage.setItem('vasuli_v1',JSON.stringify(DB))}catch(e){}}
const td=()=>new Date().toISOString().slice(0,10);
const fmt=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const num=v=>parseFloat(String(v||'').replace(/[^0-9.\-]/g,''))||0;
const mob=v=>String(v||'').replace(/\D/g,'').slice(-10);
const paid=c=>(c.pays||[]).reduce((a,p)=>a+p.amt,0);
const bs=(c,k)=>(c.bills||[]).filter(b=>b.cat===k).reduce((a,b)=>a+b.amt,0);
const tot=c=>(c.total||0)+(c.bills||[]).reduce((a,b)=>a+b.amt,0);
const out=c=>Math.max(0,tot(c)-paid(c));
function interest(c){const C=DB.cfg;if(!C.on||td()<=C.start)return 0;const d=(new Date(td())-new Date(C.start))/864e5;const per=C.unit==='year'?365:30;return out(c)*C.rate/100*(d/per)}
const dd=d=>d?d.split('-').reverse().join('/'):'-';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const last=c=>(c.calls||[]).slice(-1)[0];
function status(c){const l=last(c);if(!l||out(c)<=0)return '';const n=l.next;if(n&&n<td())return 'red';if(n&&n<=new Date(Date.now()+864e5*2).toISOString().slice(0,10))return 'yel';return ''}
function broken(c){return(c.calls||[]).filter(x=>x.res==='वचन दिले'&&x.next&&x.next<td()&&!(c.pays||[]).some(p=>p.d>=x.t.slice(0,10))).length}
function mic(id){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('या फोनमध्ये आवाज-टू-टेक्स्ट उपलब्ध नाही. कीबोर्डवरील माईक वापरा.');return}const r=new SR();r.lang={mr:'mr-IN',hi:'hi-IN',en:'en-IN'}[DB.lang]||'mr-IN';r.onresult=e=>{const el=document.getElementById(id);el.value=(el.value?el.value+' ':'')+e.results[0][0].transcript};r.onerror=()=>alert('आवाज ऐकू आला नाही, पुन्हा प्रयत्न करा.');r.start()}
const inp=(id,ph,v='')=>`<div class="row"><input id="${id}" placeholder="${ph}" value="${esc(v)}"><button class="sm" onclick="mic('${id}')" aria-label="बोला">🎤</button></div>`;

function render(){
 const a=$('#app');
 const T=[['today','आज'],['cust','ग्राहक'],['pay','वसुली'],['rep','रिपोर्ट']];
 let h='';
 if(tab==='today')h=vToday();else if(tab==='cust')h=vCust();else if(tab==='pay')h=vPay();else h=vRep();
 a.innerHTML=langBar()+h+`<div class="tabs">${T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div><button class="fab p" onclick="openCalc()" aria-label="कॅल्क्युलेटर">🧮</button>`;
}
const nm=s=>String(s||'').toLowerCase().replace(/[\s.]/g,'');
function score(c){const C=DB.cfg;if(!(c.bills||[]).length&&!(c.total||0))return null;let s=100;const why=[];const due=c.due||C.due||'2027-01-31',g=C.grace==null?30:C.grace;
 if(out(c)>0&&td()>due){const d=(new Date(td())-new Date(due))/864e5-g;if(d>0){s-=d>180?55:d>120?40:d>60?25:10;why.push('थकबाकी '+Math.round(d)+' दिवस जुनी')}}
 const b=broken(c);if(b){s-=Math.min(15,b*3);why.push('वचन चुकले '+b+' वेळा')}
 if(out(c)<=0&&(c.pays||[]).length){s=Math.min(100,s+10);why.push('पूर्ण परतफेड')}
 return{s:Math.max(0,s),why}}
function lvl(c){const r=score(c);if(!r)return{n:'⚪ नवीन',s:null,why:[]};const s=r.s;return{n:s>=80?'🌾 सुगी':s>=60?'🌿 वाढ':s>=40?'🌱 अंकुर':'🥀 कोमेजले',s,why:r.why}}
function chk(){sheet(`<div class="row sp"><h1>ग्राहक तपासा</h1><button class="sm" onclick="closeM()">बंद</button></div><input id="km" type="tel" placeholder="मोबाईल"><input id="kf" placeholder="वडिलांचे / पतीचे नाव"><input id="ka" inputmode="numeric" maxlength="4" placeholder="आधार शेवटचे 4 अंक"><button class="p" onclick="doChk()">तपासा</button><div id="kr" class="card" style="display:none"></div><div class="mute">फक्त पातळी दिसते. रक्कम आणि दुकानाचे नाव दिसत नाही.</div>`)}
function doChk(){const m=mob($('#km').value),f=nm($('#kf').value),a=$('#ka').value.replace(/\D/g,'');const c=DB.cust.find(x=>x.mobile===m);let h;
 if(m.length<10)h='मोबाईल टाका';else if(!c)h='⚪ नवीन ग्राहक (इतिहास नाही)';else if((f&&nm(c.fa)===f)||(a.length===4&&c.a4===a)){const l=lvl(c);h=`<div class="big">${l.n}</div><div class="mute">${l.why.join(' · ')}</div>`}else h='खात्री नाही. वडिलांचे नाव किंवा आधार शेवटचे 4 अंक टाका.';
 const e=$('#kr');e.style.display='block';e.innerHTML=h}
function row(c,extra=''){
 const s=status(c),l=last(c);
 return `<div class="card"><div class="row sp"><div class="grow" onclick="openC('${c.id}')"><b>${esc(c.name)}</b> <span class="mute">${esc(c.village)}</span> <span class="tag">${lvl(c).n}</span><div class="mute">${l?`${esc(l.res)} · पुढची ${dd(l.next)}`:'अजून कॉल नाही'}</div></div><div style="text-align:right"><div class="big ${s}">${fmt(out(c))}</div>${interest(c)?`<div class="mute">+ व्याज ${fmt(interest(c))}</div>`:''}</div></div>
 <div class="row" style="margin-top:6px"><button class="p grow" onclick="callC('${c.id}')">📞 फोन करा</button><button onclick="openC('${c.id}')">तपशील</button></div>${extra}</div>`;
}
function vToday(){
 const t=td(),soon=new Date(Date.now()+864e5).toISOString().slice(0,10);
 const act=DB.cust.filter(c=>out(c)>0);
 const due=act.filter(c=>{const l=last(c);return l&&l.next&&l.next<=soon}).sort((a,b)=>last(a).next.localeCompare(last(b).next));
 const fresh=act.filter(c=>!last(c)).sort((a,b)=>out(b)-out(a)).slice(0,15);
 const tot=act.reduce((s,c)=>s+out(c),0);
 const calls=DB.cust.reduce((n,c)=>n+(c.calls||[]).filter(x=>x.t.slice(0,10)===t).length,0);
 return `<h1>आजची वसुली यादी</h1><div class="grid"><div class="card"><div class="mute">एकूण बाकी</div><div class="big">${fmt(tot)}</div></div><div class="card"><div class="mute">आज कॉल</div><div class="big">${calls}</div></div></div>
 <h2>तारीख आली / उद्या</h2>${due.length?due.map(c=>row(c,`<div class="mute ${last(c).next<t?'red':'yel'}" style="margin-top:4px">${last(c).next<t?'तारीख चुकली':'ठरलेली तारीख '+dd(last(c).next)}${last(c).promise?' · वचन '+fmt(last(c).promise):''}</div>`)).join(''):'<div class="empty">आज कोणाची तारीख नाही</div>'}
 <h2>अजून कॉल न केलेले (मोठी रक्कम आधी)</h2>${fresh.length?fresh.map(c=>row(c)).join(''):'<div class="empty">ग्राहक यादी रिकामी आहे. "ग्राहक" टॅबमध्ये Excel भरा.</div>'}`;
}
function vCust(){
 const f=DB.cust.filter(c=>!q||(c.name+c.village+c.mobile).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>out(b)-out(a));
 return `<h1>ग्राहक (${DB.cust.length})</h1><div class="row"><input id="sq" placeholder="नाव / गाव / मोबाईल शोधा" value="${esc(q)}" oninput="q=this.value;clearTimeout(window.tt);window.tt=setTimeout(()=>{render();const e=$('#sq');e.focus();e.setSelectionRange(99,99)},300)"><button class="sm" onclick="mic('sq');setTimeout(()=>{q=$('#sq').value;render()},4000)">🎤</button></div>
 <div class="row" style="margin:6px 0"><button class="p grow" onclick="addC()">+ नवा ग्राहक</button><button class="grow" onclick="$('#xf').click()">Excel भरा</button><button class="grow" onclick="chk()">🔍 तपासा</button></div><input type="file" id="xf" accept=".xlsx,.xls,.csv" hidden onchange="importX(this.files[0])">
 ${f.slice(0,60).map(c=>row(c)).join('')||'<div class="empty">ग्राहक सापडला नाही</div>'}${f.length>60?'<div class="mute">पहिले 60 दाखवले, शोध वापरा</div>':''}`;
}
function vPay(){
 const all=[];DB.cust.forEach(c=>(c.pays||[]).forEach(p=>all.push({...p,n:c.name,id:c.id})));
 all.sort((a,b)=>b.d.localeCompare(a.d));
 const m=td().slice(0,7),mt=all.filter(p=>p.d.startsWith(m)).reduce((s,p)=>s+p.amt,0);
 return `<h1>वसुली</h1><div class="card"><div class="mute">या महिन्यात वसूल</div><div class="big grn">${fmt(mt)}</div></div>
 ${all.slice(0,50).map(p=>`<div class="card row sp" onclick="openC('${p.id}')"><div><b>${esc(p.n)}</b><div class="mute">${dd(p.d)} · ${p.mode}</div></div><div class="big grn">${fmt(p.amt)}</div></div>`).join('')||'<div class="empty">अजून वसुली नोंद नाही</div>'}`;
}
function vRep(){
 const act=DB.cust.filter(c=>out(c)>0);
 const b=[0,0,0,0],lab=['0-30 दिवस','30-60','60-90','90+'];
 act.forEach(c=>{const l=last(c);const days=l?(Date.now()-new Date(l.t))/864e5:0;b[days<30?0:days<60?1:days<90?2:3]+=out(c)});
 const bk=act.filter(c=>broken(c)>=2).sort((a,b)=>broken(b)-broken(a));
 const C=DB.cfg;
 return `<h1>रिपोर्ट व सेटिंग</h1><h2>वारंवार वचन मोडणारे</h2>${bk.map(c=>`<div class="card row sp" onclick="openC('${c.id}')"><b>${esc(c.name)}</b><span class="red">${broken(c)} वेळा वचन चुकले</span></div>`).join('')||'<div class="mute">कोणीही नाही</div>'}
 <h2>शेवटच्या संपर्कानंतरचे दिवस</h2><div class="card">${lab.map((l,i)=>`<div class="row sp"><span>${l}</span><b>${fmt(b[i])}</b></div>`).join('')}</div>
 <h2>व्याज सेटिंग</h2><div class="card"><label class="row"><input type="checkbox" style="width:auto" ${C.on?'checked':''} onchange="DB.cfg.on=this.checked;save()"> व्याज लावा</label>
 <div class="row"><input id="cr" type="number" step="0.1" value="${C.rate}"><select id="cu"><option value="month" ${C.unit==='month'?'selected':''}>% दरमहा</option><option value="year" ${C.unit==='year'?'selected':''}>% दरवर्षी</option></select></div>
 <div class="mute">व्याज सुरू होण्याची तारीख (या तारखेनंतर एकूण बाकीवर)</div><input id="cs" type="date" value="${C.start}">
 <button class="p" onclick="DB.cfg.rate=num($('#cr').value);DB.cfg.unit=$('#cu').value;DB.cfg.start=$('#cs').value;save();alert('सेव्ह झाले');render()">सेव्ह करा</button></div>
 <h2>हंगाम परतफेड</h2><div class="card"><div class="mute">ठरलेली अंतिम तारीख</div><input id="sd" type="date" value="${C.due||'2027-01-31'}"><div class="mute">सवलतीचे दिवस</div><input id="sg" type="number" value="${C.grace==null?30:C.grace}"><button class="p" onclick="DB.cfg.due=$('#sd').value;DB.cfg.grace=num($('#sg').value);save();alert('सेव्ह झाले');render()">सेव्ह करा</button></div>
 <h2>डेटा</h2><div class="row"><button class="grow" onclick="exportJ()">बॅकअप घ्या</button><button class="grow" onclick="$('#jf').click()">बॅकअप परत घ्या</button></div><input type="file" id="jf" accept=".json" hidden onchange="importJ(this.files[0])">
 <h2>दिसणे</h2><div class="row"><button class="grow" onclick="fs(1)">अक्षर मोठे</button><button class="grow" onclick="fs(-1)">लहान</button><button class="grow" onclick="th()">डार्क/लाईट</button></div>`;
}
function fs(d){const r=document.documentElement;r.style.fontSize=(parseFloat(getComputedStyle(r).fontSize)+d*2)+'px'}
function th(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'}
function closeM(){$('#modal').innerHTML='';sel=null}
function sheet(h){$('#modal').innerHTML=`<div class="sheet" onclick="if(event.target===this)closeM()"><div>${h}</div></div>`}

function callC(id){const c=DB.cust.find(x=>x.id===id);DB.pend=id;save();location.href='tel:'+c.mobile}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&DB.pend){const id=DB.pend;DB.pend=null;save();callForm(id)}});
function callForm(id){
 const c=DB.cust.find(x=>x.id===id);sel=id;
 sheet(`<h1>कॉल नोंद: ${esc(c.name)}</h1><div class="mute">बाकी ${fmt(out(c))}</div>
 <select id="cres">${TAGS.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>
 <div class="mute">ग्राहकाने काय कारण सांगितले</div>${inp('cwhy','कारण (बोलून लिहा)')}
 <div class="mute">पुढची तारीख</div><input id="cnx" type="date" min="${td()}">
 <div class="mute">वचन दिलेली रक्कम</div><input id="cpr" type="number" inputmode="numeric" placeholder="₹">
 ${inp('cnt','इतर नोंद')}
 <div class="row"><button class="p grow" onclick="saveCall()">सेव्ह करा</button><button onclick="closeM()">नंतर</button></div>`);
}
function saveCall(){
 const c=DB.cust.find(x=>x.id===sel);
 c.calls=c.calls||[];c.calls.push({t:new Date().toISOString(),res:$('#cres').value,why:$('#cwhy').value,next:$('#cnx').value,promise:num($('#cpr').value),note:$('#cnt').value});
 save();closeM();render();
}
function openC(id){
 const c=DB.cust.find(x=>x.id===id);sel=id;
 const ev=[...(c.calls||[]).map(x=>({t:x.t.slice(0,10),h:`<span class="tag">${esc(x.res)}</span> ${esc(x.why)} ${x.next?'· पुढची '+dd(x.next):''}${x.promise?' · वचन '+fmt(x.promise):''}<div class="mute">${esc(x.note)}</div>`})),...(c.bills||[]).map(b=>({t:b.d,h:`<b>${fmt(b.amt)}</b> ${CAT[b.cat]} बिल`})),...(c.pays||[]).map(p=>({t:p.d,h:`<b class="grn">+ ${fmt(p.amt)}</b> ${p.mode}`}))].sort((a,b)=>b.t.localeCompare(a.t));
 sheet(`<div class="row sp"><h1>${esc(c.name)}</h1><button class="sm" onclick="closeM()">बंद</button></div><div class="mute">${esc(c.village)} · ${esc(c.mobile)}</div><div>${lvl(c).n}${lvl(c).s!=null?' · '+lvl(c).s+'/100':''}</div><div class="mute">${lvl(c).why.join(' · ')}</div>
 <div class="grid"><div class="card"><div class="mute">एकूण</div><b>${fmt(tot(c))}</b></div><div class="card"><div class="mute">जमा</div><b class="grn">${fmt(paid(c))}</b></div><div class="card"><div class="mute">बाकी</div><b class="red">${fmt(out(c))}</b></div><div class="card"><div class="mute">व्याज (आजपर्यंत)</div><b>${fmt(interest(c))}</b></div></div>${sumHtml(c)}${ledgerHtml(c)}
 <div class="mute">वचन चुकले ${broken(c)} वेळा</div>
 <h2>बिल (खत / बियाणे / औषध)</h2>${billsHtml(c)}
 <div class="card"><div class="row"><select id="bc"><option value="fert">खत</option><option value="seed">बियाणे</option><option value="pest">औषध</option></select><input id="ba" type="number" inputmode="numeric" placeholder="रक्कम ₹"></div><input id="bd" type="date" value="${td()}"><input id="bn" placeholder="बिल क्र. (ऐच्छिक)"><button class="p" onclick="addBill()">बिल जोडा</button></div>

function ledgerHtml(c){
 const E=[];(c.bills||[]).forEach(b=>E.push({d:b.d,k:0,t:CAT[b.cat]+' बिल'+(b.no?' · '+esc(b.no):''),a:b.amt}));
 (c.pays||[]).forEach(p=>E.push({d:p.d,k:1,t:'जमा · '+p.mode,a:-p.amt}));
 E.sort((x,y)=>x.d.localeCompare(y.d)||x.k-y.k);
 let bal=c.total||0;
 const row=(d,t,a,b,cl='')=>`<div class="row sp" style="padding:4px 0;border-bottom:1px solid var(--line)"><span class="grow">${d}<div class="mute">${t}</div></span><b class="${cl}" style="min-width:84px;text-align:right">${a}</b><b style="min-width:96px;text-align:right">${b}</b></div>`;
 let h=row('—','सुरुवातीची शिल्लक (जुनी + सुरुवातीचे खत/बियाणे/औषध)',fmt(c.total||0),fmt(bal));
 E.forEach(x=>{bal+=x.a;h+=row(dd(x.d),x.t,(x.a<0?'− ':'+ ')+fmt(Math.abs(x.a)),fmt(bal),x.a<0?'grn':'')});
 return `<h2>खातेवही</h2><div class="card">${h}<div class="row sp" style="margin-top:6px"><b>शिल्लक</b><b class="red">${fmt(bal)}</b></div></div>`}
function sumHtml(c){const ot=(c.total||0)-(c.fert||0)-(c.seed||0)-(c.pest||0);const r=(l,v,cl='')=>`<div class="row sp"><span>${l}</span><b class="${cl}">${fmt(v)}</b></div>`;

function billsHtml(c){
 const ot=(c.total||0)-(c.fert||0)-(c.seed||0)-(c.pest||0);
 let h=['fert','seed','pest'].map(k=>{const op=c[k]||0,bl=(c.bills||[]).filter(b=>b.cat===k).sort((a,b)=>a.d.localeCompare(b.d));if(!op&&!bl.length)return '';

 if(ot>0)h+=`<div class="card row sp"><span>इतर जुनी बाकी</span><b>${fmt(ot)}</b></div>`;

 o.total=o.fert+o.seed+o.pest+num($('#ft').value);
 if(id)Object.assign(DB.cust.find(x=>x.id===id),o);else{const d=$('#fd')?$('#fd').value:td(),B=[['fert',o.fert],['seed',o.seed],['pest',o.pest]].filter(x=>x[1]>0).map((x,i)=>({id:'b'+Date.now()+i,cat:x[0],d:d||td(),amt:x[1],no:''}));DB.cust.push({id:'c'+Date.now(),calls:[],pays:[],...o,fert:0,seed:0,pest:0,total:num($('#ft').value),bills:B})}

function importX(f){
 if(!f)return;const r=new FileReader();
 r.onload=e=>{try{
  const wb=XLSX.read(e.target.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const CK=/fert|खत|khat|khad|seed|बियाणे|biy|pest|औषध|aushad/i;
  const col=(r,ks,sk)=>{for(const x of ks)for(const k in r){const l=k.toLowerCase();if(l.includes(x)&&!(sk&&CK.test(l)))return k}return null};
  const pick=(r,ks,sk)=>{const k=col(r,ks,sk);return k==null?'':r[k]};
  let add=0,upd=0,mm=0;
  rows.forEach(r=>{const m=mob(pick(r,['mobile','मोबाईल','phone','मोबा']));const n=String(pick(r,['name','नाव'])).trim();if(!n||m.length<10)return;
   const o={name:n,village:String(pick(r,['village','gav','गाव'])),mobile:m,total:num(pick(r,['total','एकूण','ekun','baki','बाकी','balance','outstanding'],1)),fert:num(pick(r,['fert','खत','khat','khad'])),seed:num(pick(r,['seed','बियाणे','biyan'])),pest:num(pick(r,['pest','औषध','aushad']))};
   const cs=o.fert+o.seed+o.pest,tk=col(r,['सुरुवात','shillak','shillik','शिल्लक','opening'],1);if(tk)o.total=cs+num(r[tk]);else if(!o.total)o.total=cs;if(!tk&&cs&&o.total!==cs)mm++;
   const ex=DB.cust.find(x=>x.mobile===m&&x.name.toLowerCase()===n.toLowerCase());
   if(ex){Object.assign(ex,o);upd++}else{DB.cust.push({id:'c'+Date.now()+add+upd,calls:[],pays:[],...o});add++}});
  save();render();alert('नवीन '+add+', अपडेट '+upd+' (दुबार नाही)'+(mm?' · बेरीज जुळत नाही: '+mm:''));
 }catch(err){alert('फाईल वाचता आली नाही. इंटरनेट चालू करून पुन्हा प्रयत्न करा किंवा CSV वापरा.')}};
 r.readAsArrayBuffer(f);
}

const LS=L.slice().sort((a,b)=>b[0].length-a[0].length);
function T(s){const i=DB.lang==='hi'?1:DB.lang==='en'?2:0;if(!i||!/[\u0900-\u097F]/.test(s))return s;let r=s;for(const e of LS)if(r.includes(e[0]))r=r.split(e[0]).join(e[i]);return r}
function trAll(n){const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let x;while(x=w.nextNode()){const v=T(x.nodeValue);if(v!==x.nodeValue)x.nodeValue=v}n.querySelectorAll('[placeholder]').forEach(e=>{const v=T(e.placeholder);if(v!==e.placeholder)e.placeholder=v})}
const obs=new MutationObserver(()=>{trAll(document.body);obs.takeRecords()});obs.observe(document.body,{childList:true,subtree:true,characterData:true});
const _al=window.alert.bind(window),_cf=window.confirm.bind(window);window.alert=s=>_al(T(s));window.confirm=s=>_cf(T(s));
