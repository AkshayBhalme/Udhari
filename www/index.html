<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>वसुली - Professional Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f4ef;--card:#fbfaf7;--ink:#26302b;--mute:#6b746e;--line:#e1dfd6;--main:#1f5a45;--onmain:#fff;--red:#b3402f;--yel:#9a6b00;--grn:#2c7a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b201d;--card:#232a26;--ink:#e6e9e4;--mute:#98a39b;--line:#333c37;--main:#5fb08a;--onmain:#102018;--red:#e0806f;--yel:#d9a93c;--grn:#6cc08c}}
:root[data-theme="dark"]{--bg:#1b201d;--card:#232a26;--ink:#e6e9e4;--mute:#98a39b;--line:#333c37;--main:#5fb08a;--onmain:#102018;--red:#e0806f;--yel:#d9a93c;--grn:#6cc08c}
html{font-size:17px;height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans Devanagari',system-ui,sans-serif;line-height:1.5}
#app{max-width:640px;margin:0 auto;padding:12px 14px 96px}
h1{font-size:1.25rem;margin:4px 0 10px}h2{font-size:1.05rem;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:.85rem}.big{font-size:1.3rem;font-weight:700}
.red{color:var(--red)}.yel{color:var(--yel)}.grn{color:var(--grn)}
button,input,select,textarea{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:4px 0}
button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
button.p{background:var(--main);color:var(--onmain);border-color:var(--main);font-weight:600}
button.sm{min-height:36px;padding:6px 10px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;border:0;border-radius:0;background:none;min-height:56px;color:var(--mute)}
.tabs button.on{color:var(--main);font-weight:700;box-shadow:inset 0 3px 0 var(--main)}
.fab{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:6;width:52px;height:52px;border-radius:26px;padding:0;font-size:1.4rem}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-width:640px;margin:0 auto;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:14px;box-sizing:border-box}
.tag{display:inline-block;padding:1px 8px;border-radius:8px;border:1px solid var(--line);font-size:.8rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t{border-left:3px solid var(--line);padding-left:10px;margin:8px 0}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
const TAGS=['वचन दिले','फोन उचलला नाही','फोन बंद','नकार दिला','भांडण','पैसे दिले'];
const MODES=['रोख','UPI','चेक'];const CAT={fert:'खत',seed:'बियाणे',pest:'औषध'};
let DB={cust:[],cfg:{rate:3,unit:'month',start:'2026-12-31',on:true},pend:null,lang:'mr'},tab='today',q='',sel=null,calcOpen=false;
const SK=()=>{try{const u=localStorage.getItem('vasuli_cur');return u?'vasuli_u_'+u:'vasuli_v1'}catch(e){return 'vasuli_v1'}};
try{const s=localStorage.getItem(SK());if(s)DB=Object.assign(DB,JSON.parse(s))}catch(e){}
function save(){try{const k=SK();localStorage.setItem(k,JSON.stringify(k==='vasuli_v1'&&localStorage.getItem('vasuli_legacy')?{lang:DB.lang}:DB))}catch(e){}}
const td=()=>new Date().toISOString().slice(0,10);
const fmt=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const num=v=>parseFloat(String(v||'').replace(/[^0-9.\-]/g,''))||0;
const mob=v=>String(v||'').replace(/\D/g,'').slice(-10);
const PY=c=>(c.pays||[]).filter(x=>!x.v),BL=c=>(c.bills||[]).filter(x=>!x.v);
const isOwner=()=>DB.role!=='staff';
const paid=c=>PY(c).reduce((a,p)=>a+p.amt,0);
const bs=(c,k)=>BL(c).filter(b=>b.cat===k).reduce((a,b)=>a+b.amt,0);
const tot=c=>(c.total||0)+BL(c).reduce((a,b)=>a+b.amt,0);
const out=c=>Math.max(0,tot(c)-paid(c));
function icalc(c,E){const C=DB.cfg;if(!C.on)return 0;const pe=C.start||'2026-12-31',iv=C.ivFrom||'',it=C.ivTo||'',R=C.rate/100/(C.unit==='year'?365:30),end=it&&it<E?it:E,dy=(a,b)=>(new Date(b)-new Date(a))/864e5,O='0000-00-00';
 const I=[];const add=(d,a,k)=>{if(a>0){const s=iv?(d>iv?d:iv):(k==='pest'||d===O)?(d>pe?d:pe):d;I.push({d,r:a,s})}};
 add(O,c.fert||0,'pest');add(O,c.seed||0,'pest');add(O,c.pest||0,'pest');add(O,(c.total||0)-(c.fert||0)-(c.seed||0)-(c.pest||0),'pest');
 BL(c).forEach(b=>add(b.d,b.amt,b.cat));
 I.sort((x,y)=>x.d.localeCompare(y.d));let T=0;
 [...PY(c)].sort((x,y)=>x.d.localeCompare(y.d)).forEach(p=>{let a=p.amt;const e=p.d<end?p.d:end;for(const i of I){if(a<=0)break;if(i.d>p.d||i.r<=0)continue;const x=Math.min(i.r,a);if(e>i.s)T+=x*R*dy(i.s,e);i.r-=x;a-=x}});
 I.forEach(i=>{if(i.r>0&&end>i.s)T+=i.r*R*dy(i.s,end)});return T}
function interest(c){return icalc(c,td())}
const dd=d=>d?d.split('-').reverse().join('/'):'-';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const last=c=>(c.calls||[]).slice(-1)[0];
function status(c){const l=last(c);if(!l||out(c)<=0)return '';const n=l.next;if(n&&n<td())return 'red';if(n&&n<=new Date(Date.now()+864e5*2).toISOString().slice(0,10))return 'yel';return ''}
function broken(c){return(c.calls||[]).filter(x=>x.res==='वचन दिले'&&x.next&&x.next<td()&&!PY(c).some(p=>p.d>=x.t.slice(0,10))).length}
function micWeb(id){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('या फोनमध्ये आवाज-टू-टेक्स्ट उपलब्ध नाही. कीबोर्डवरील माईक वापरा.');return}const r=new SR();r.lang={mr:'mr-IN',hi:'hi-IN',en:'en-IN'}[DB.lang]||'mr-IN';r.onresult=e=>{const el=document.getElementById(id);el.value=(el.value?el.value+' ':'')+e.results[0][0].transcript};r.onerror=()=>alert('आवाज ऐकू आला नाही, पुन्हा प्रयत्न करा.');r.start()}
const inp=(id,ph,v='')=>`<div class="row"><input id="${id}" placeholder="${ph}" value="${esc(v)}"><button class="sm" onclick="mic('${id}')" aria-label="बोला">🎤</button></div>`;

function render(){if(!DB.auth){$('#app').innerHTML=gateHtml();return}
 const a=$('#app');
 const T=[['today','आज'],['cust','ग्राहक'],['pay','वसुली'],['rep','रिपोर्ट']];
 let h='';
 if(tab==='today')h=vToday();else if(tab==='cust')h=vCust();else if(tab==='pay')h=vPay();else h=vRep();
 a.innerHTML=topBar()+h+`<div class="tabs">${T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div><button class="fab p" onclick="openCalc()" aria-label="कॅल्क्युलेटर">🧮</button>`;
}
const nm=s=>String(s||'').toLowerCase().replace(/[\s.]/g,'');
function score(c){const C=DB.cfg;if(!BL(c).length&&!(c.total||0))return null;let s=100;const why=[];const due=c.due||C.due||'2027-01-31',g=C.grace==null?30:C.grace;
 if(out(c)>0&&td()>due){const d=(new Date(td())-new Date(due))/864e5-g;if(d>0){s-=d>180?55:d>120?40:d>60?25:10;why.push('थकबाकी '+Math.round(d)+' दिवस जुनी')}}
 const b=broken(c);if(b){s-=Math.min(15,b*3);why.push('वचन चुकले '+b+' वेळा')}
 if(out(c)<=0&&PY(c).length){s=Math.min(100,s+10);why.push('पूर्ण परतफेड')}
 return{s:Math.max(0,s),why}}
function lvl(c){if(c.dis)return{n:'⚖ वादात',s:null,why:[]};const r=score(c);if(!r)return{n:'⚪ नवीन',s:null,why:[]};const s=r.s;return{n:s>=80?'🌾 सुगी':s>=60?'🌿 वाढ':s>=40?'🌱 अंकुर':'🥀 कोमेजले',s,why:r.why}}
const FB={key:'AIzaSyDqGH0T-RvbX9jAqCEkVu3fl2WHeFsPZeA',pid:'vasooli-1a5f8'};
const FS='https://firestore.googleapis.com/v1/projects/'+FB.pid+'/databases/(default)/documents';
const nmOf=s=>s>=80?'🌾 सुगी':s>=60?'🌿 वाढ':s>=40?'🌱 अंकुर':'🥀 कोमेजले';
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('vasuli-v1-'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function authCall(kind,email,pw){const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+kind+'?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw,returnSecureToken:true})});const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||'ERROR');DB.auth={uid:j.localId,id:j.idToken,rt:j.refreshToken,email,exp:Date.now()+3500e3}}

// --- FORGOT PASSWORD FUNCTION ---
async function forgotPassword(){
  const email = prompt('तुमचा नोंदणीकृत ईमेल टाका:');
  if(!email) return;
  try {
    const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key='+FB.key, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({requestType: 'PASSWORD_RESET', email: email.trim()})
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error && j.error.message || 'ERROR');
    alert('पासवर्ड रीसेट करण्याची लिंक तुमच्या ईमेलवर पाठवली आहे!');
  } catch(e) {
    alert('एरर: ' + e.message);
  }
}

async function tok(){const a=DB.auth;if(!a)throw new Error('NOLOGIN');if(Date.now()>a.exp){const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+a.rt});const j=await r.json();if(!r.ok)throw new Error('LOGIN');a.id=j.id_token;a.rt=j.refresh_token;a.exp=Date.now()+3500e3;save()}return a.id}
const enc=o=>{const r={};for(const k in o){const v=o[k];r[k]=typeof v==='number'?{integerValue:String(Math.round(v))}:{stringValue:String(v)}}return r};
async function fsr(m,p,f){const t=await tok();const r=await fetch(FS+p,{method:m,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:f?JSON.stringify({fields:enc(f)}):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||'ERROR');return j}
async function publish(){let n=0;for(const c of DB.cust){if(c.mobile.length<10||c.dis||!c.cs)continue;const r=score(c);if(!r)continue;const h=await sha('m|'+c.mobile),h2=c.fa?await sha('f|'+c.mobile+'|'+nm(c.fa)):'x',h3=c.a4?await sha('a|'+c.mobile+'|'+c.a4):'x';await fsr('PATCH','/ratings/'+h+'_'+SID(),{h,h2,h3,s:r.s,why:r.why.join(' · '),u:td()});n++}return n}
async function cloudLookup(m){const t=await tok();const h=await sha('m|'+m);const r=await fetch(FS+':runQuery',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({structuredQuery:{from:[{collectionId:'ratings'}],where:{fieldFilter:{field:{fieldPath:'h'},op:'EQUAL',value:{stringValue:h}}}}})});const j=await r.json();if(!r.ok)throw new Error('LOOKUP');return j.filter(x=>x.document).map(x=>{const f=x.document.fields;return{h2:f.h2.stringValue,h3:f.h3.stringValue,s:+f.s.integerValue,why:f.why.stringValue}})}
async function backup(){let n=0;for(const c of DB.cust){await fsr('PATCH','/shops/'+DB.auth.uid+'/cust/'+c.id,{j:JSON.stringify(c)});n++}await fsr('PATCH','/shops/'+DB.auth.uid+'/meta/cfg',{j:JSON.stringify(DB.cfg)});await fsr('PATCH','/shops/'+DB.auth.uid+'/meta/profile',{n:DB.shop||''});return n}
async function restore(){let n=0,pt='';do{const j=await fsr('GET','/shops/'+DB.auth.uid+'/cust?pageSize=100'+(pt?'&pageToken='+pt:''));(j.documents||[]).forEach(d=>{try{const c=JSON.parse(d.fields.j.stringValue),i=DB.cust.findIndex(x=>x.id===c.id);if(i<0)DB.cust.push(c);else DB.cust[i]=c;n++}catch(e){}});pt=j.nextPageToken||''}while(pt);try{const g=await fsr('GET','/shops/'+DB.auth.uid+'/meta/cfg');DB.cfg=JSON.parse(g.fields.j.stringValue)}catch(e){}try{const p=await fsr('GET','/shops/'+DB.auth.uid+'/meta/profile');DB.shop=p.fields.n.stringValue}catch(e){}save();render();return n}
async function act(f,m){try{const n=await f();alert(m+' ('+n+')')}catch(e){alert('नेट किंवा लॉगिन तपासा: '+e.message)}}
function aP(){act(publish,'मानांकन प्रकाशित झाले')}function aB(){act(backup,'बॅकअप झाला')}function aR(){act(restore,'परत घेतले')}
const D0=()=>({cust:[],cfg:{rate:3,unit:'month',start:'2026-12-31',on:true},pend:null,lang:'mr'});
function topBar(){setTimeout(chkApv,0);return '<div class="row sp" style="margin-bottom:6px"><b>🏪 '+esc(DB.shop||DB.auth.email)+'</b><button class="sm" onclick="logout()">बाहेर पडा</button></div>'+langBar()}
async function chkApv(){const e=$('#apv');if(!e||!DB.auth)return;try{await fsr('GET','/members/'+SID());e.textContent='नेटवर्क मंजुरी: ✅ मंजूर'}catch(x){e.textContent=/not.?found/i.test(x.message)?'नेटवर्क मंजुरी: ⏳ प्रतीक्षा':'नेटवर्क मंजुरी: तपासता आली नाही (नेट?)'}}

function gateHtml(){return '<h1 style="text-align:center;margin-top:40px">वसुली</h1><div class="card"><input id="ce3" placeholder="दुकानाचे नाव (नवीन खात्यासाठी)"><input id="ce2" type="email" placeholder="ईमेल"><input id="cp2" type="password" placeholder="पासवर्ड (6+ अक्षरे)"><div class="row"><button class="p grow" onclick="doLogin(0)">लॉगिन</button><button class="grow" onclick="doLogin(1)">नवीन खाते</button></div><button class="sm" style="width:100%;margin-top:8px;background:transparent;border:none;color:var(--main);text-decoration:underline;cursor:pointer" onclick="forgotPassword()">पासवर्ड विसरलात? (Forgot Password)</button></div><div class="mute" style="text-align:center">पहिल्या लॉगिनला इंटरनेट लागते.</div>'+langBar()}

async function afterLogin(){const a=DB.auth;localStorage.setItem('vasuli_cur',a.uid);const s=localStorage.getItem('vasuli_u_'+a.uid);
 if(s){try{DB=Object.assign(D0(),JSON.parse(s))}catch(e){DB=D0()}}
 else if(DB.cust.length&&!localStorage.getItem('vasuli_legacy')&&confirm('या फोनवरील जुना डेटा या खात्यात घ्यायचा?')){try{localStorage.removeItem('vasuli_v1')}catch(e){}}
 else DB=Object.assign(D0(),{lang:DB.lang});
 localStorage.setItem('vasuli_legacy','1');try{localStorage.removeItem('vasuli_v1')}catch(e){}
 DB.auth=a;if(window.pendShop)DB.shop=window.pendShop;try{const u=await fsr('GET','/users/'+a.uid);DB.sid=u.fields.shop.stringValue;DB.who=u.fields.name.stringValue;DB.role='staff'}catch(e){DB.sid=null;DB.role='owner';DB.who=DB.who||'मालक'}save();try{await sync()}catch(e){}render()}
async function logout(){if(!confirm('बाहेर पडण्यापूर्वी डेटा क्लाउडवर बॅकअप होईल. पुढे जायचे?'))return;const k=SK();let ok=1;try{await backup()}catch(e){ok=0;if(!confirm('बॅकअप झाला नाही (नेट नाही?). तरीही बाहेर पडायचे? हा डेटा या फोनवर राहील.'))return}
 if(ok)localStorage.removeItem(k);localStorage.removeItem('vasuli_cur');localStorage.setItem('vasuli_legacy','1');try{localStorage.removeItem('vasuli_v1')}catch(e){}location.reload()}
const SID=()=>DB.sid||DB.auth.uid,cj=c=>JSON.stringify(c);
function mergeC(l,r){const m={...r};['calls','lg'].forEach(k=>{const q=new Set(),o=[];[...(l[k]||[]),...(r[k]||[])].forEach(x=>{const j=JSON.stringify(x);if(!q.has(j)){q.add(j);o.push(x)}});m[k]=o});
 ['pays','bills'].forEach(k=>{const M=new Map();[...(l[k]||[]),...(r[k]||[])].forEach(x=>{const key=x.id||JSON.stringify(x),o=M.get(key);if(!o||(x.v&&!o.v))M.set(key,x)});m[k]=[...M.values()]});return m}
async function sync(){DB.sh=DB.sh||{};let up=0,dn=0;const t=await tok();
 const r=await fetch(FS+'/shops/'+SID()+':runQuery',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({structuredQuery:{from:[{collectionId:'cust'}],where:{fieldFilter:{field:{fieldPath:'u'},op:'GREATER_THAN',value:{integerValue:String(DB.lp||0)}}}}})});
 const j=await r.json();if(!r.ok)throw new Error('SYNC');let mx=DB.lp||0;
 for(const x of j){if(!x.document)continue;const f=x.document.fields,c=JSON.parse(f.j.stringValue);mx=Math.max(mx,+f.u.integerValue);if(cj(c)===DB.sh[c.id])continue;const i=DB.cust.findIndex(y=>y.id===c.id);
  if(i<0)DB.cust.push(c);else if(cj(DB.cust[i])===DB.sh[c.id])DB.cust[i]=c;else DB.cust[i]=mergeC(DB.cust[i],c);
  DB.sh[c.id]=cj(c);dn++}
 let pl=0;if(DB.role==='staff'||!DB.shop||!DB.cust.length){try{const g=await fsr('GET','/shops/'+SID()+'/meta/cfg');DB.cfg=JSON.parse(g.fields.j.stringValue);const p=await fsr('GET','/shops/'+SID()+'/meta/profile');DB.shop=p.fields.n.stringValue;pl=1}catch(e){}}
 if(DB.role!=='staff'&&!pl){await fsr('PATCH','/shops/'+SID()+'/meta/cfg',{j:JSON.stringify(DB.cfg)});await fsr('PATCH','/shops/'+SID()+'/meta/profile',{n:DB.shop||''})}
 for(const c of DB.cust){if(cj(c)!==DB.sh[c.id]){await fsr('PATCH','/shops/'+SID()+'/cust/'+c.id,{j:cj(c),u:Date.now()});DB.sh[c.id]=cj(c);up++}}
 DB.lp=Math.max(0,mx-120000);save();if(!$('#modal').innerHTML)render();return up+'↑ '+dn+'↓'}
async function backup(){return sync()}
async function restore(){DB.lp=0;DB.sh={};return sync()}
async function autoSync(){if(!DB.auth||!navigator.onLine||window._sy)return;window._sy=1;try{await sync()}catch(e){}window._sy=0}
async function addStaff(){const u=$('#sf').value.trim(),n=$('#sn').value.trim();if(!u||!n)return alert('ID आणि नाव टाका');try{await fsr('PATCH','/users/'+u,{shop:DB.auth.uid,name:n});(DB.cfg.staff=DB.cfg.staff||[]).push(n);save();alert('स्टाफ जोडला. त्यांनी बाहेर पडून पुन्हा लॉगिन करावे.')}catch(e){alert('नेट किंवा लॉगिन तपासा: '+e.message)}}

async function doChk(){if(!DB.auth)return doChkLocal();const m=mob($('#km').value),f=$('#kf').value,a=$('#ka').value.replace(/\D/g,''),e=$('#kr');e.style.display='block';

function vToday(){

function ledgerHtml(c){

function importX(f){
 if(!f)return;const r=new FileReader();
 r.onload=e=>{try{
  const wb=XLSX.read(e.target.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const CK=/fert|खत|khat|khad|seed|बियाणे|biy|pest|औषध|aushad/i;
  const col=(r,ks,sk)=>{for(const x of ks)for(const k in r){const l=k.toLowerCase();if(l.includes(x)&&!(sk&&CK.test(l)))return k}return null};
  const pick=(r,ks,sk)=>{const k=col(r,ks,sk);return k==null?'':r[k]};
  let add=0,upd=0,mm=0;
  rows.forEach(r=>{const m=mob(pick(r,['mobile','मोबाईल','phone','मोबा']));const n=String(pick(r,['name','नाव'])).trim();if(!n||m.length<10)return;
   const o={name:n,village:String(pick(r,['village','gav','गाव'])),mobile:m,total:num(pick(r,['total','एकूण','ekun','baki','बाकी','balance','outstanding'],1)),fert:num(pick(r,['fert','खत','khat','khad'])),seed:num(pick(r,['seed','बियाणे','biyan'])),pest:num(pick(r,['pest','औषध','aushad']))};
   const cs=o.fert+o.seed+o.pest,tk=col(r,['सुरुवात','shillak','shillik','शिल्लक','opening'],1);if(tk)o.total=cs+num(r[tk]);else if(!o.total)o.total=cs;if(!tk&&cs&&o.total!==cs)mm++;
   const ex=DB.cust.find(x=>x.mobile===m&&x.name.toLowerCase()===n.toLowerCase());
   if(ex){Object.assign(ex,o);upd++}else{DB.cust.push({id:'c'+Date.now()+add+upd,calls:[],pays:[],...o});add++}});
  save();render();alert('नवीन '+add+', अपडेट '+upd+' (दुबार नाही)'+(mm?' · बेरीज जुळत नाही: '+mm:''));
 }catch(err){alert('फाईल वाचता आली नाही. इंटरनेट चालू करून पुन्हा प्रयत्न करा किंवा CSV वापरा.')}};
 r.readAsArrayBuffer(f);
}

async function schedRem(){try{const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(!LN||!DB.auth)return;let pm=await LN.checkPermissions();if(pm.display!=='granted'){pm=await LN.requestPermissions();if(pm.display!=='granted')return}

  if(t0>now)ns.push({id:id++,title:'वसुली: उद्या '+L.length+' कॉल',body:nm,schedule:{at:t0}})}
 if(ns.length)await LN.schedule({notifications:ns})}catch(e){}}
